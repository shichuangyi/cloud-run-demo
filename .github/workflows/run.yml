name: Run demo

on:
  workflow_dispatch:
  push:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show runner info
        run: |
          echo $RUNNER_OS
          python --version
      - name: Run demo.py
        run: python demo.py
